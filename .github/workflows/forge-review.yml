# Keeps .forge/reviews/pr-<n>.md current, without anyone having to ask.
#
# Decision 026: the review file has to exist in the repository, not only on
# whoever happened to be at the keyboard. Reviews arrive minutes after a push,
# usually after the session has ended, and a plugin that has exited cannot
# fetch anything. So the fetch runs here instead, on GitHub's side.
#
# Decision 005 is unchanged by this: nothing on the user's machine pushes
# without being asked. The consent for this lives in installing the workflow.

name: forge review notes

on:
  # A submitted review is one event carrying all of its inline comments, so it
  # is the right thing to wake on. `pull_request_review_comment` fires once per
  # comment — on the first live run CodeRabbit's pass triggered six jobs and
  # committed the same file six times. It stays as a backstop for a comment
  # added on its own later, and the concurrency rule below collapses bursts.
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

# Only what the job needs: write the notes file, read the review.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: forge-review-${{ github.event.pull_request.number }}
  # Cancel, do not queue. This said `false` on the reasoning that queueing
  # protected a second reviewer's findings from being dropped — which was
  # wrong, and the first live run showed it: six queued jobs wrote the same
  # file six times.
  #
  # Every run re-reads the whole review from GitHub and regenerates the file,
  # so a run that is cancelled contributes nothing the survivor will not read
  # for itself. The last job to run sees the most complete state by definition.
  cancel-in-progress: true

jobs:
  notes:
    # Never on a fork. A pull request from a fork must not reach a token with
    # write access, and this job has one (decision 026).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        contains(github.event.review.user.login, 'coderabbit') ||
        contains(github.event.review.user.login, 'sourcery') ||
        contains(github.event.comment.user.login, 'coderabbit') ||
        contains(github.event.comment.user.login, 'sourcery')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch under review
        # Pinned to a commit, not a tag. This job holds a token that can write
        # to the repository, and a mutable tag is a way for someone else to
        # decide what runs with it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # The push below authenticates explicitly, so the checkout does not
          # need to leave a credential behind in the git config.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Read the review into .forge/reviews/ and commit it
        # Every value from the event goes through the environment. Interpolating
        # `${{ ... }}` straight into a run block is still parsed as shell after
        # substitution, so a branch legitimately named `x$(id)` would execute.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name  "forge-mentor[bot]"
          git config user.email "forge-mentor@users.noreply.github.com"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          for attempt in 1 2 3; do
            python scripts/forge_review.py "${PR_NUMBER}"

            # Exactly one path is ever staged, so this job cannot commit
            # anything but the notes.
            git add .forge/reviews/

            if git diff --cached --quiet; then
              echo "No change to the review notes."
              exit 0
            fi

            git commit -m "chore: review notes for pull request #${PR_NUMBER}"

            if git push "${remote}" "HEAD:${HEAD_REF}"; then
              exit 0
            fi

            # Someone else pushed while this ran — the other reviewer's job,
            # most likely. Rebasing is the wrong tool: the notes file is
            # regenerated whole on every fetch, so a three-way merge of it is
            # meaningless and would conflict every time. Take their commit and
            # fetch again instead. The refetch reads GitHub, which by now holds
            # both reviewers' comments, so the file it writes contains both.
            echo "Push rejected (attempt ${attempt}) — taking the remote and re-reading the review."
            git reset --hard HEAD~1
            git fetch "${remote}" "${HEAD_REF}"
            git reset --hard FETCH_HEAD
          done

          echo "Could not push the review notes after three attempts."
          exit 1
